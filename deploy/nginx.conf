limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server {
  listen 80;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
  location /api/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://app:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /metrics { allow 127.0.0.1; allow 172.16.0.0/12; deny all; proxy_pass http://app:8000; }
  location / { proxy_pass http://app:8000; proxy_set_header Host $host; }
}
