global:
  scrape_interval: 15s
scrape_configs:
  - job_name: antam-api
    metrics_path: /metrics
    static_configs:
      - targets: [app:8000]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
