services:
  app:
    build: .
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://antam:${POSTGRES_PASSWORD:-antam_dev}@postgres:5432/antam
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["8000"]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antam
      POSTGRES_USER: antam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antam_dev}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antam -d antam"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@antam.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin@123}
    ports: ["5050:80"]
    depends_on: [postgres]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "promdata:/prometheus"]
    depends_on: [app]
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    expose: ["9100"]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://antam:${POSTGRES_PASSWORD:-antam_dev}@postgres:5432/antam?sslmode=disable
    depends_on: [postgres]
    expose: ["9187"]
  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    volumes: ["./deploy/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro", "./deploy/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro", "./deploy/antam-overview.json:/var/lib/grafana/dashboards/antam-overview.json:ro", "grafanadata:/var/lib/grafana"]
    depends_on: [prometheus, loki]
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
    volumes: ["./deploy/loki-config.yml:/etc/loki/local-config.yaml:ro", "lokidata:/loki"]
volumes:
  pgdata:
  promdata:
  grafanadata:
  lokidata:
