services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    privileged: true
    pid: host
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  grafana:
    volumes:
      - ./deploy/antam-containers.json:/var/lib/grafana/dashboards/antam-containers.json:ro